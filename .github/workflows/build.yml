name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$GITHUB_WORKSPACE/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/tmp-extract
          mv $ANDROID_HOME/tmp-extract/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          rm -rf $ANDROID_HOME/tmp-extract cmdline-tools.zip
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
          echo "sdk.dir=$ANDROID_HOME" > $GITHUB_WORKSPACE/android/local.properties

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Patch settings.gradle.kts (add google repo)
        working-directory: android
        run: |
          cp settings.gradle.kts settings.gradle.kts.bak || true
          NAME_LINE=$(grep -E "rootProject.name" settings.gradle.kts.bak | head -1)
          INCLUDE_LINES=$(grep -E "^\s*include" settings.gradle.kts.bak)
          [ -z "$NAME_LINE" ] && NAME_LINE='rootProject.name = "football-analyzer"'
          [ -z "$INCLUDE_LINES" ] && INCLUDE_LINES='include(":app")'
          cat > settings.gradle.kts <<EOF
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          $NAME_LINE
          $INCLUDE_LINES
          EOF
          echo "===== 新的 settings.gradle.kts ====="
          cat settings.gradle.kts

      - name: Remove duplicate launcher icons
        working-directory: android
        run: |
          echo "===== 删除前 mipmap 目录 ====="
          ls -R app/src/main/res 2>/dev/null | grep mipmap || true
          for d in app/src/main/res/mipmap-*; do
            [ -d "$d" ] || continue
            for xml in "$d"/*.xml; do
              [ -f "$xml" ] || continue
              png="${xml%.xml}.png"
              if [ -f "$png" ]; then
                echo "删除重复图标: $png"
                rm -f "$png"
              fi
            done
          done
          find app/src/main/res -name "ic_launcher*.png" | while read p; do
            if [ -f "${p%.png}.xml" ]; then echo "再删: $p"; rm -f "$p"; fi
          done
          echo "===== 删除后 mipmap 目录 ====="
          ls -R app/src/main/res 2>/dev/null | grep mipmap || true

      - name: Build Debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"

      - name: Publish to Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: "**/app/build/outputs/apk/debug/*.apk"