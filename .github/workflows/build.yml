name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$GITHUB_WORKSPACE/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME
          curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_HOME/tmp-extract
          mv $ANDROID_HOME/tmp-extract/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          rm -rf $ANDROID_HOME/tmp-extract cmdline-tools.zip
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/build-tools/34.0.0" >> $GITHUB_PATH
          echo "sdk.dir=$ANDROID_HOME" > $GITHUB_WORKSPACE/android/local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        working-directory: android
        run: |
          if [ -f gradlew ]; then
            echo "==> 使用 gradlew 构建"
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            echo "==> 未找到 gradlew，改用 gradle 直接构建"
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"

      - name: Publish to Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: "**/app/build/outputs/apk/debug/*.apk"