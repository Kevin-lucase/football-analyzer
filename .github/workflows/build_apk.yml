name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          SDK=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          echo "sdk.dir=$SDK" > local.properties
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "全球足球智能分析_v1.0.0.apk"
      - uses: actions/upload-artifact@v4
        with: {name: football-ai-apk, path: "*.apk"}
      - name: Publish to Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with: {tag_name: v1.0.0, files: "*.apk", body: "自动构建的安卓 APK（debug 签名，可直接安装）"}
  test-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt && pytest -q server/tests
